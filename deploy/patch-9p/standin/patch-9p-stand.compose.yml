# Надстройка compose v2 для СИНТЕТИЧЕСКОГО стенда проверки патча G9p (tools/patch-9p-synth.sh).
# На бою не используется. Два сервиса, documents и app, запускаются из образов lock, но без
# зависимостей боя: у documents и app заглушки на bun, которые отвечают на /health, /ready (с
# четырьмя «ботами») и POST /docx/amend, как образ documents G8y. Заглушка documents отвечает и на
# POST /docx/pages, но ТОЛЬКО пока контейнер работает на «новом» образе: так стенд различает старый
# и новый образ documents (старый отвечает 404, новый - 422 bad_request на некорректный base64 и
# 422 empty_file на пустой файл). Какой образ сейчас у documents, заглушка узнаёт из файла
# /stand-state/docs-new в томе из $STAND_STATE_DIR (файл есть - образ новый): файл ведёт фоновый
# наблюдатель synth-скрипта по docker inspect. Том и переменные ОДИНАКОВЫ при старом и новом lock,
# поэтому `compose config` боя и примерки патча различаются только образами и двумя переменными app.
# Образы заглушек - образы с bun (прежний и новый образ app из lock'ов этапов 8z и 9p). Порты
# публикуются только на 127.0.0.1 в диапазоне стенда (по умолчанию 21500-21549, база задаётся
# P9P_PORT_BASE): так прогон измеряет простой app со стороны хоста. Четыре флага G8x documents,
# переменные поиска G8w и переменные G8z у app, а также две новые переменные app G9p
# (PRICE_EDIT_FIRST_ENABLED, DOCX_PAGES_ENABLED) попадают в окружение из compose.project.yml
# дерева стенда, как на бою. Переменные: STAND_APP_PORT, STAND_DOCS_PORT (порты хоста),
# STAND_STATE_DIR (каталог с файлом-признаком нового образа documents), STAND_APP_DOCUMENTS_URL
# (адрес documents в окружении app).
x-docs-stub-server: &docs_stub_server
  - bun
  - -e
  - |
    const port = Number(process.env.STAND_PORT);
    const PARTIES = ["buyer", "seller"];
    const NUMBER_MODES = ["append", "replace"];
    const BASE64 = /^[A-Za-z0-9+/]*={0,2}$/;
    const json = { headers: { "content-type": "application/json" } };
    const reply = (status, error) => new Response(JSON.stringify({ detail: { error } }),
      { ...json, status });
    const newImage = () => require("node:fs").existsSync("/stand-state/docs-new");
    Bun.serve({ hostname: "0.0.0.0", port, async fetch(req) {
      const path = new URL(req.url).pathname;
      if (path === "/ready") return new Response(JSON.stringify({ bots: { ready: 4 } }), json);
      if (path === "/health") return new Response("{}", json);
      if (path === "/docx/pages" && req.method === "POST") {
        // Старый образ ручки не знает: 404 со строкой в detail (как FastAPI без маршрута).
        if (!newImage()) {
          return new Response(JSON.stringify({ detail: "Not Found" }), { ...json, status: 404 });
        }
        let body = {};
        try { body = await req.json(); } catch (e) { return reply(422, "bad_request"); }
        if (typeof body.content_base64 !== "string" || !BASE64.test(body.content_base64)
          || body.content_base64.length % 4 !== 0) {
          return reply(422, "bad_request");
        }
        return reply(422, "empty_file");
      }
      if (path === "/docx/amend" && req.method === "POST") {
        let body = {};
        try { body = await req.json(); } catch (e) { return reply(422, "bad_request"); }
        if (body.party !== undefined && !PARTIES.includes(body.party)) {
          return reply(422, "bad_request");
        }
        const mode = body.number_edit?.mode;
        if (body.number_edit !== undefined && !NUMBER_MODES.includes(mode)) {
          return reply(422, "bad_request");
        }
        return reply(422, "empty_file");
      }
      return new Response("{}", json);
    } });
    process.on("SIGTERM", () => process.exit(0));
    setInterval(() => {}, 1 << 30);
x-app-stub-server: &app_stub_server
  - bun
  - -e
  - |
    const port = Number(process.env.STAND_PORT);
    const json = { headers: { "content-type": "application/json" } };
    Bun.serve({ hostname: "0.0.0.0", port, async fetch(req) {
      const path = new URL(req.url).pathname;
      if (path === "/ready") return new Response(JSON.stringify({ bots: { ready: 4 } }), json);
      if (path === "/health") return new Response("{}", json);
      return new Response("{}", json);
    } });
    process.on("SIGTERM", () => process.exit(0));
    setInterval(() => {}, 1 << 30);
services:
  documents:
    entrypoint: *docs_stub_server
    command: !override []
    labels:
      bai.stage: "9p"
    environment:
      - STAND_PORT=8310
    healthcheck: !override
      disable: true
    depends_on: !override {}
    volumes: !override
      - ${STAND_STATE_DIR:-/tmp}:/stand-state:ro
    # Сеть backend платформы internal: порты контейнеров в ней наружу не публикуются, поэтому
    # заглушки сидят ещё и в обычной сети стенда stand-pub (иначе проба с хоста не дойдёт).
    networks: !override [backend, stand-pub]
    ports:
      - "127.0.0.1:${STAND_DOCS_PORT:-21501}:8310"
  app:
    entrypoint: *app_stub_server
    labels:
      bai.stage: "9p"
    environment:
      - STAND_PORT=8088
      - DOCUMENTS_URL=${STAND_APP_DOCUMENTS_URL:-http://documents:8310}
    depends_on: !override {}
    networks: !override [backend, stand-pub]
    volumes: !override []
    ports:
      - "127.0.0.1:${STAND_APP_PORT:-21500}:8088"

networks:
  stand-pub: {}
