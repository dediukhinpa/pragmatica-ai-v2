# Надстройка compose v2 для СИНТЕТИЧЕСКОГО стенда проверки патча G9s (tools/patch-9s-synth.sh).
# На бою не используется. Два сервиса, documents и app, запускаются из образов lock, но без
# зависимостей боя: у documents и app заглушки на bun, которые отвечают на /health, /ready (с
# четырьмя «ботами»), POST /docx/pages и POST /docx/amend, как образ documents G9r: /health 200,
# /ready 200 с четырьмя «ботами»; /docx/pages отвечает 422 bad_request на некорректный base64 и
# 422 empty_file на пустой файл; /docx/amend отвечает 422 bad_request, если party или
# number_edit.mode не из набора заглушки, и 422 empty_file на пустой файл при верных полях (набор
# значений ТОЛЬКО для заглушки, настоящие значения знает образ documents); на прочее 200. Патч
# G9s пересоздаёт только app, documents остаётся на прежнем образе, поэтому его заглушка
# одинакова до и после патча (различаются только образ app и переменные app).
# Образы заглушек - образы с bun (синтетический прогон берёт образы app и documents прежнего и
# нового lock). Порты публикуются только на 127.0.0.1 в диапазоне стенда (по умолчанию
# 21400-21449, база задаётся P9S_PORT_BASE): так прогон измеряет простой app со стороны хоста.
# Четыре флага G8x documents, переменные записи звонка G9r, поиска G8w, G8z, G9p, G9q, G9q2 и
# G9q3 у app, а также три новые переменные app G9s (CHAT_ATTACHMENTS_STORE_ENABLED,
# CHAT_ATTACHMENTS_RETENTION_DAYS, CHAT_ATTACHMENTS_MAX_BYTES: список NEW_APP_VARS) попадают в
# окружение из compose.project.yml дерева стенда, как на бою.
# Том приёма: у app смонтирован том intake-data (с платформы) по пути INTAKE_ROOT боя, как на
# бою; пробу тома патч делает внутри app через docker exec (bun из образа app), поэтому у
# заглушки app он нужен. Права на каталог тома определяет образ app (как на бою).
# Переменные: STAND_APP_PORT, STAND_DOCS_PORT (порты хоста), STAND_APP_DOCUMENTS_URL (адрес
# documents в окружении app).
x-stub-server: &stub_server
  - bun
  - -e
  - |
    const port = Number(process.env.STAND_PORT);
    const PARTIES = ["buyer", "seller"];
    const NUMBER_MODES = ["append", "replace"];
    const BASE64 = /^[A-Za-z0-9+/]*={0,2}$/;
    const json = { headers: { "content-type": "application/json" } };
    const reply = (status, error) => new Response(JSON.stringify({ detail: { error } }),
      { ...json, status });
    Bun.serve({ hostname: "0.0.0.0", port, async fetch(req) {
      const path = new URL(req.url).pathname;
      if (path === "/ready") return new Response(JSON.stringify({ bots: { ready: 4 } }), json);
      if (path === "/health") return new Response("{}", json);
      if (path === "/docx/pages" && req.method === "POST") {
        // Образ documents G9p: некорректный base64 - 422 bad_request, пустой файл - empty_file.
        let body = {};
        try { body = await req.json(); } catch (e) { return reply(422, "bad_request"); }
        if (typeof body.content_base64 !== "string" || !BASE64.test(body.content_base64)
          || body.content_base64.length % 4 !== 0) {
          return reply(422, "bad_request");
        }
        return reply(422, "empty_file");
      }
      if (path === "/docx/amend" && req.method === "POST") {
        let body = {};
        try { body = await req.json(); } catch (e) { return reply(422, "bad_request"); }
        if (body.party !== undefined && !PARTIES.includes(body.party)) {
          return reply(422, "bad_request");
        }
        const mode = body.number_edit?.mode;
        if (body.number_edit !== undefined && !NUMBER_MODES.includes(mode)) {
          return reply(422, "bad_request");
        }
        return reply(422, "empty_file");
      }
      return new Response("{}", json);
    } });
    process.on("SIGTERM", () => process.exit(0));
    setInterval(() => {}, 1 << 30);
services:
  documents:
    entrypoint: *stub_server
    command: !override []
    labels:
      bai.stage: "9s"
    environment:
      - STAND_PORT=8310
    healthcheck: !override
      disable: true
    depends_on: !override {}
    volumes: !override []
    # Сеть backend платформы internal: порты контейнеров в ней наружу не публикуются, поэтому
    # заглушки сидят ещё и в обычной сети стенда stand-pub (иначе проба с хоста не дойдёт).
    networks: !override [backend, stand-pub]
    ports:
      - "127.0.0.1:${STAND_DOCS_PORT:-21401}:8310"
  app:
    entrypoint: *stub_server
    labels:
      bai.stage: "9s"
    environment:
      - STAND_PORT=8088
      - DOCUMENTS_URL=${STAND_APP_DOCUMENTS_URL:-http://documents:8310}
    depends_on: !override {}
    networks: !override [backend, stand-pub]
    volumes: !override
      - intake-data:/var/lib/pragmatika/intake
    ports:
      - "127.0.0.1:${STAND_APP_PORT:-21400}:8088"

networks:
  stand-pub: {}
